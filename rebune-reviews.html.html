<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ريبون العالمية للتجارة | قيّم تجربتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161c;
    --ink-2:#1b212a;
    --card:#1f2630;
    --card-border:#2c3644;
    --brass:#c9a45c;
    --brass-light:#e3c98b;
    --teal:#2f7d6e;
    --text-1:#f3f1ea;
    --text-2:#a9b0bb;
    --text-3:#6f7885;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--ink);
    color:var(--text-1);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    width:100%;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .stars-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.35;
    background-image:radial-gradient(1px 1px at 20% 30%, var(--brass) 0, transparent 100%),
                      radial-gradient(1px 1px at 70% 60%, var(--brass) 0, transparent 100%),
                      radial-gradient(1px 1px at 40% 80%, var(--brass) 0, transparent 100%),
                      radial-gradient(1px 1px at 85% 20%, var(--brass) 0, transparent 100%),
                      radial-gradient(1px 1px at 55% 45%, var(--brass) 0, transparent 100%);
  }
  .wrap{
    width:100%;
    max-width:460px;
    position:relative;
    z-index:1;
    animation:rise .7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  .brand{
    text-align:center;
    margin-bottom:8px;
  }
  .brand-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
    border-radius:50%;
    border:1px solid var(--brass);
    margin-bottom:18px;
    position:relative;
  }
  .brand-mark::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    border:1px solid rgba(201,164,92,0.35);
  }
  .brand-mark span{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:22px;
    color:var(--brass-light);
    letter-spacing:1px;
  }
  .brand h1{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--text-1);
    letter-spacing:.2px;
  }
  .brand p{
    font-size:13px;
    color:var(--brass);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
    font-family:'Cairo', sans-serif;
  }
  .lede{
    text-align:center;
    color:var(--text-2);
    font-size:15px;
    line-height:1.9;
    margin:26px 0 34px;
    padding:0 8px;
  }
  .lede b{
    color:var(--text-1);
    font-weight:500;
  }
  .branches{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .branch{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:18px 20px;
    text-decoration:none;
    transition:border-color .25s ease, transform .25s ease, background .25s ease;
  }
  .branch:hover{
    border-color:var(--brass);
    background:var(--ink-2);
    transform:translateY(-2px);
  }
  .branch:active{
    transform:translateY(0);
  }
  .icon{
    flex:none;
    width:46px;
    height:46px;
    border-radius:10px;
    background:rgba(201,164,92,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{
    width:22px;
    height:22px;
    stroke:var(--brass-light);
  }
  .branch-info{
    flex:1;
    min-width:0;
  }
  .branch-info .city{
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--text-1);
    margin-bottom:3px;
  }
  .branch-info .sub{
    font-size:13px;
    color:var(--text-3);
  }
  .go{
    flex:none;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .25s ease;
  }
  .branch:hover .go{
    background:var(--brass);
  }
  .go svg{
    width:15px;
    height:15px;
    stroke:var(--text-2);
    transition:stroke .25s ease;
  }
  .branch:hover .go svg{
    stroke:var(--ink);
  }
  .stars-row{
    display:flex;
    justify-content:center;
    gap:4px;
    margin-top:38px;
  }
  .stars-row svg{
    width:16px;
    height:16px;
    fill:var(--brass);
  }
  footer{
    text-align:center;
    margin-top:16px;
    font-size:12px;
    color:var(--text-3);
    letter-spacing:.5px;
  }
</style>
</head>
<body>
<div class="stars-bg"></div>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark"><span>R</span></div>
    <h1>شركة ريبون العالمية للتجارة</h1>
    <p>REBUNE</p>
  </div>

  <p class="lede">
    رأيك يهمنا ويساعدنا نتطور أكثر 🤍<br>
    اختر <b>الفرع</b> الذي تعاملت معه لمشاركتنا تقييمك على قوقل
  </p>

  <div class="branches">
    <a class="branch" href="https://g.page/r/CdzK9TICkQBZEBM/review" target="_blank" rel="noopener">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      </div>
      <div class="branch-info">
        <div class="city">فرع الرياض</div>
        <div class="sub">شركة ريبون العالمية للتجارة</div>
      </div>
      <div class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </div>
    </a>

    <a class="branch" href="https://g.page/r/CZR9boKO035EEBM/review" target="_blank" rel="noopener">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      </div>
      <div class="branch-info">
        <div class="city">فرع الدمام</div>
        <div class="sub">مستودعات شركة ريبون العالمية للتجارة</div>
      </div>
      <div class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </div>
    </a>
  </div>

  <div class="stars-row">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L21 9.3l-4.9 4.5L17.5 21 12 17.6 6.5 21l1.4-7.2L3 9.3l6.1-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L21 9.3l-4.9 4.5L17.5 21 12 17.6 6.5 21l1.4-7.2L3 9.3l6.1-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L21 9.3l-4.9 4.5L17.5 21 12 17.6 6.5 21l1.4-7.2L3 9.3l6.1-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L21 9.3l-4.9 4.5L17.5 21 12 17.6 6.5 21l1.4-7.2L3 9.3l6.1-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L21 9.3l-4.9 4.5L17.5 21 12 17.6 6.5 21l1.4-7.2L3 9.3l6.1-.7z"/></svg>
  </div>

  <footer>REBUNE — BEYOND IMAGINATION</footer>

</div>
</body>
</html>
